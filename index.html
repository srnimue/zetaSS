<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクショ黒塗りツール V90.22</title>
<link rel="stylesheet" href="style.css?v=90220">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<main class="container">
<h1>スクショ黒塗りツール</h1>
<p class="description">OCRで名前を自動で黒塗りしたあと、手動で追加の黒塗りができます。</p>

<section class="panel">
<label for="fileInput">スクリーンショット</label>
<input id="fileInput" type="file" accept="image/*">

<label for="targetText">黒塗りする文字</label>
<input id="targetText" type="text" placeholder="例：ゆーざー" autocomplete="off">
<div id="targetHistory" class="target-history" hidden></div>

<div class="button-row main-actions">
<button id="redactBtn" type="button" disabled>✨ 自動検出</button>
<button id="manualBtn" type="button" disabled>🖊 手動</button>
<button id="undoBtn" type="button" disabled>↩️ 戻す</button>
<button id="resetBtn" class="secondary reset-button" type="button" disabled>🗑</button>
</div>

<div class="button-row-left diagnostic-row">
<button id="diagnoseBtn" type="button" disabled>OCR診断</button>
</div>

<button id="manualDoneBtn" class="secondary" type="button" hidden>手動黒塗り終了</button>

<label class="checkbox standalone-stamp">
  <input id="stampMode" type="checkbox" disabled>
  スタンプモード
</label>

<details class="option-panel">
  <summary>オプション</summary>
  <div class="option-panel-body">
    <div class="manual-draw-setting option-item">
      <label for="manualDrawMode">手動の描画方法</label>
      <div class="manual-draw-controls">
        <select id="manualDrawMode">
          <option value="trace" selected>なぞり式（高さ固定）</option>
          <option value="free">自由矩形</option>
        </select>
        <button id="manualHelpBtn" class="help-button" type="button" aria-label="手動モードの使い方" aria-haspopup="dialog" aria-controls="manualHelpDialog">?</button>
      </div>
    </div>

    <div class="option-item">
      <label for="redactionMode">隠し方</label>
      <div class="redaction-style-controls">
        <select id="redactionMode">
          <option value="black">黒塗り</option>
          <option value="bg">背景色</option>
          <option value="blur">ぼかし</option>
          <option value="color">任意の色</option>
        </select>
        <input id="redactionColor" type="color" value="#1a1a1a" aria-label="任意の色">
      </div>
    </div>

  </div>
</details>

<div id="manualHelpDialog" class="help-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="manualHelpTitle">
  <div class="help-dialog-backdrop" data-help-close></div>
  <div class="help-dialog-card" role="document">
    <div class="help-dialog-header">
      <h2 id="manualHelpTitle">手動モードの使い方</h2>
      <button id="manualHelpCloseBtn" class="help-dialog-close" type="button" aria-label="説明を閉じる">×</button>
    </div>
    <div class="help-dialog-body">
      <p><strong>なぞり式</strong>：文字の上を横になぞると、高さ固定の黒塗りを作れます。</p>
      <p><strong>自由矩形</strong>：指で囲んだ範囲を自由な大きさで黒塗りします。</p>
      <p><strong>スタンプモード</strong>：直前に作った手動の隠し範囲と同じサイズを、画像をタップして追加できます。</p>
      <p><strong>既存の黒塗り</strong>：タップして選択し、中央をドラッグで移動、四隅をドラッグでサイズ変更できます。</p>
      <p><strong>削除</strong>：選択した黒塗りの左上に出る「×」を押します。</p>
      <p><strong>画像の移動・拡大縮小</strong>：2本指で移動、ピンチで拡大縮小できます。</p>
    </div>
  </div>
</div>
</section>

<pre id="status" class="status">画像を選択してください。</pre>

<section class="canvas-panel">
<div id="canvasWrap">
<canvas id="canvas"></canvas>
<div id="selection" hidden></div>
<button id="manualDeleteBtn" class="manual-delete-btn" type="button" hidden aria-label="この黒塗りを削除">×</button>
<div id="ocrDebugLayer" hidden></div>
</div>
<div class="zoom-controls">
<button id="zoomOutBtn" type="button">－</button>
<span id="zoomLabel">100%</span>
<button id="zoomInBtn" type="button">＋</button>
</div>
</section>

<section class="actions">
<button id="saveBtn" type="button" disabled>画像を保存</button>
</section>

<pre id="errorDetails" class="error" hidden></pre>
<pre id="ocrDiagnostics" class="diagnostics" hidden></pre>
</main>
<script src="app.js?v=90220"></script>
</body>
</html>
