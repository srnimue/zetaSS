<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクショ黒塗りツール V82.1</title>
<link rel="stylesheet" href="style.css?v=32">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<main class="container">
<h1>スクショ黒塗りツール</h1>
<p class="description">OCRで名前を自動で黒塗りしたあと、手動で追加の黒塗りができます。</p>

<section class="panel">
<label for="fileInput">スクリーンショット</label>
<input id="fileInput" type="file" accept="image/*">

<label for="targetText">黒塗りする文字</label>
<input id="targetText" type="text" placeholder="例：ゆーざー" autocomplete="off">

<label for="overlayText">置き換え文字</label>
<input id="overlayText" type="text" value="{{user}}" autocomplete="off">

<label class="checkbox">
<input id="overlayName" type="checkbox">
黒塗り部分に置き換え文字を表示
</label>

<label class="checkbox">
<input id="stampMode" type="checkbox" disabled>
スタンプモード（直前の手動黒塗りと同じサイズ）
</label>

<div class="button-row main-actions">
<button id="redactBtn" type="button" disabled>✨ 自動検出</button>
<button id="manualBtn" type="button" disabled>🖊 手動</button>
<button id="undoBtn" type="button" disabled>↩️ 戻す</button>
<button id="resetBtn" class="secondary reset-button" type="button" disabled>🗑</button>
</div>

<div class="button-row-left diagnostic-row">
<button id="diagnoseBtn" type="button" disabled>OCR診断</button>
</div>

<p class="manual-help" id="manualHelp" hidden>
手動黒塗り中：画像の上を指やマウスでドラッグして黒塗りを追加できます。既存の黒塗りはドラッグで移動、四隅でサイズ変更できます。ダブルタップ／ダブルクリックで削除できます。
</p>
<button id="manualDoneBtn" class="secondary" type="button" hidden>手動黒塗り終了</button>
</section>

<pre id="status" class="status">画像を選択してください。</pre>

<section class="canvas-panel">
<div id="canvasWrap">
<canvas id="canvas"></canvas>
<div id="selection" hidden></div>
<div id="ocrDebugLayer" hidden></div>
</div>
<div class="zoom-controls">
<button id="zoomOutBtn" type="button">－</button>
<span id="zoomLabel">100%</span>
<button id="zoomInBtn" type="button">＋</button>
</div>
</section>

<section class="actions">
<button id="saveBtn" type="button" disabled>画像を保存</button>
</section>

<pre id="errorDetails" class="error" hidden></pre>
<pre id="ocrDiagnostics" class="diagnostics" hidden></pre>
</main>
<script src="app.js?v=823"></script>

<script>
/* V82.3: disabled legacy visual bridge.
   Does not change OCR or blacking. It only watches the diagnostic text and,
   when a bbox=(x,y,w,h) appears, asks the debug helper to draw it. */
(function(){
  function scanV822(){
    try{
      if(typeof window.drawV82_2CandidateDebug !== "function") return;
      const text = document.body ? document.body.innerText : "";
      const m = text.match(/bbox=\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*\)/);
      if(!m) return;
      const c = {x:+m[1], y:+m[2], w:+m[3], h:+m[4]};
      window.drawV82_2CandidateDebug(c);
    }catch(e){}
  }
  setInterval(scanV822, 700);
  window.addEventListener("load", function(){ setTimeout(scanV822, 500); });
})();
</script>

</body>
</html>
