<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zetaスクショ黒塗りツール v7</title>

    <link rel="stylesheet" href="style.css">

    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>
    <main>
        <h1>Zetaスクショ黒塗りツール</h1>

        <p class="note">
            画像はブラウザ内で処理します。サーバーへアップロードしません。
        </p>

        <label>
            スクリーンショット
            <input id="fileInput" type="file" accept="image/*">
        </label>

        <label>
            黒塗りする文字
            <input id="targetText" type="text" placeholder="例：にみゅ">
        </label>

        <label>
            置き換え文字
            <input id="overlayText" type="text" value="{{user}}">
        </label>

        <label class="checkbox-label">
            <input id="overlayName" type="checkbox">
            黒塗り部分に置き換え文字を表示
        </label>


        <div class="buttons">
            <button id="redactBtn" disabled>
                OCRして黒塗り
            </button>

            <button id="saveBtn" disabled>
                画像を保存
            </button>
        </div>

        <p id="status">
            画像を選択してください。
        </p>

        <pre id="errorDetails" hidden></pre>

        <canvas id="canvas"></canvas>
    </main>

    <script src="app.js"></script>
</body>
</html>
